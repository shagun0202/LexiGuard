<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="48" fill="#0F172A"/>
  <rect x="2" y="2" width="236" height="236" rx="46" stroke="#334155" stroke-width="2"/>

  <!-- Outer Shield Outline -->
  <path d="M120 32 L185 62 V122 C185 168 156 200 120 214 C84 200 55 168 55 122 V62 Z" 
        stroke="url(#shieldGrad)" stroke-width="6" fill="#1E293B" filter="url(#glow)" />

  <!-- Inner Geometric Protection Core -->
  <path d="M120 48 L170 72 V120 C170 156 148 184 120 196 C92 184 70 156 70 120 V72 Z" 
        fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" opacity="0.9" />

  <!-- Legal Balance Scales / Neural Node Monogram -->
  <!-- Center Pillar -->
  <line x1="120" y1="80" x2="120" y2="162" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Scale Crossbar -->
  <line x1="90" y1="96" x2="150" y2="96" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Left Scale Pan -->
  <path d="M90 96 L78 126 H102 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
  <line x1="78" y1="126" x2="90" y2="96" stroke="#34D399" stroke-width="1.5"/>
  <line x1="102" y1="126" x2="90" y2="96" stroke="#34D399" stroke-width="1.5"/>

  <!-- Right Scale Pan -->
  <path d="M150 96 L138 126 H162 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
  <line x1="138" y1="126" x2="150" y2="96" stroke="#34D399" stroke-width="1.5"/>
  <line x1="162" y1="126" x2="150" y2="96" stroke="#34D399" stroke-width="1.5"/>

  <!-- Tech Nodes -->
  <circle cx="120" cy="80" r="5" fill="#34D399"/>
  <circle cx="120" cy="162" r="6" fill="#38BDF8"/>
  <circle cx="90" cy="96" r="3.5" fill="#38BDF8"/>
  <circle cx="150" cy="96" r="3.5" fill="#38BDF8"/>
</svg>
